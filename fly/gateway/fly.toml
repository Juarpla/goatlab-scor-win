app = "goatlab-gateway"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  OPENCLAW_STATE_DIR = "/data"
  OPENCLAW_CONFIG_PATH = "/home/node/.openclaw/openclaw.json"
  OPENCODE_GO_MODEL = "deepseek-v4.1-flash"
  OPENCODE_GO_FALLBACK_MODEL = "mimo-v2.6-flash"
  AGNES_IMAGE_MODEL = "agnes-image-2.5-flash"
  AGNES_TIMEOUT_SECONDS = "300"
  AGNES_MAX_IMAGES = "4"
  AGNES_VIDEO_MODEL = "agnes-video-2.5-flash"
  # Token Plan Starter: AGNES_API_KEY (fly secret) debe ser llave Token.
  AGNES_IMAGE_RPM = "12"
  AGNES_VIDEO_START_INTERVAL = "30"
  AGNES_DAILY_VIDEO_SECONDS_CAP = "360"
  AGNES_DAILY_IMAGE_CAP = "4000"
  GOATLAB_CONTENT_BASE_URL = "https://goatlab.win"
  # R2 es el único almacén de la media (las claves van en fly secrets).
  MEDIA_GEN_BASE = "https://pub-7a18e0f62bb14c3a987f20633a81b283.r2.dev"
  R2_PUBLIC_BASE = "https://pub-7a18e0f62bb14c3a987f20633a81b283.r2.dev"
  R2_BUCKET = "goatlab"
  R2_STATE_BUCKET = "app-states"
  R2_STATE_KEY = "goatlab/agnes-state.json"
  WORKER_URL = "https://goatlab-render.fly.dev"
  TELEGRAM_ALLOWED_USERS = "1295170307"
  TELEGRAM_PUBLIC_WEBHOOK_URL = "https://goatlab-gateway.fly.dev/telegram-webhook"
  OPENCLAW_UI_ORIGIN = "https://goatlab-gateway.fly.dev"

[mounts]
  source = "goatlab_state"
  destination = "/data"

[[vm]]
  size = "shared-cpu-2x"
  memory = "2gb"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 0
  kill_timeout = "30s"

  [[http_service.checks]]
    grace_period = "60s"
    interval = "30s"
    method = "GET"
    path = "/healthz"
    protocol = "http"
    timeout = "5s"
