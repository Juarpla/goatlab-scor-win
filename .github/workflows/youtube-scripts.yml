name: "2-scripting"
on:
  workflow_dispatch:
    inputs:
      match:
        description: 'ID del partido (webId o id). Vacío = top N'
        required: false
        type: string
      top:
        description: 'Cuántos partidos del ranking (vacío = SCRIPT_TOP_N o 5)'
        required: false
        type: string
      category:
        description: 'Contenido que se debe preparar'
        type: choice
        default: all
        options: [all, scripts, image-prompts, video-prompts, motion-prompts]
      force:
        description: 'Reescribir aunque el JSON ya exista'
        type: boolean
        default: false
  workflow_run:
    workflows: ["1-update-data"]
    types: [completed]
# Corre después de que los datos ya están en main. Un fallo de narración
# no bloquea el deploy de probabilidades.
permissions:
  contents: write
  actions: read
concurrency:
  group: goatlab-content-pipeline
  cancel-in-progress: false
  queue: max
jobs:
  shorts:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    env:
      CONTENT_SELECTION_FILE: .cache/content-selection.json
      MATCH: ${{ inputs.match }}
      TOP: ${{ inputs.top }}
      SCRIPT_TOP_N: ${{ vars.SCRIPT_TOP_N }}
      CONTENT_AUTOMATIC: ${{ github.event_name != 'workflow_dispatch' && '1' || '0' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # historial completo: el commit del bot hace rebase antes del push
          ref: main # el SHA del workflow que disparó este job es el de antes del commit de datos
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Fijar selección compartida
        run: node scripts/content-selection.mjs
      - name: Preparar categorías independientes
        id: scripts
        continue-on-error: true # los JSON válidos se commitean aunque otro partido falle
        run: |
          args=()
          if [ -n "$MATCH" ]; then args+=("--match=$MATCH"); fi
          if [ -n "$TOP" ]; then args+=("--top=$TOP"); fi
          if [ "$FORCE" = "true" ]; then args+=("--force"); fi
          args+=("--category=${CATEGORY:-all}")
          node scripts/generate-match-content.mjs "${args[@]}"
        env:
          CATEGORY: ${{ inputs.category }}
          MATCH: ${{ inputs.match }}
          TOP: ${{ inputs.top }}
          FORCE: ${{ inputs.force }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          WORKERS_AI_API_KEY: ${{ secrets.WORKERS_AI_API_KEY }}
          OPENCODE_GO_API_KEY: ${{ secrets.OPENCODE_GO_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          MISTRAL_BASE_URL: ${{ vars.MISTRAL_BASE_URL }}
          MISTRAL_MODEL: ${{ vars.MISTRAL_MODEL }}
          WORKERS_AI_MODEL: ${{ vars.WORKERS_AI_MODEL }}
          OPENCODE_GO_MODEL: ${{ vars.OPENCODE_GO_MODEL }}
          OPENCODE_GO_FALLBACK_MODEL: ${{ vars.OPENCODE_GO_FALLBACK_MODEL }}
          LLM_PROVIDER_ORDER: ${{ vars.LLM_PROVIDER_ORDER }}
          SCRIPT_TOP_N: ${{ vars.SCRIPT_TOP_N }}
          SCRIPT_PROVIDER_ORDER: ${{ vars.SCRIPT_PROVIDER_ORDER || 'OPENCODE_GO_FALLBACK_MODEL,OPENCODE_GO_MODEL,MISTRAL_MODEL,WORKERS_AI_MODEL' }}
      - name: Lint de guiones
        run: node scripts/check-compliance.mjs --selection=.cache/content-selection.json
      - name: Validar prompts
        run: node scripts/check-match-prompts.mjs --selection=.cache/content-selection.json
      - name: Commit de contenido
        if: always() && steps.scripts.outcome != 'skipped'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for path in public/data/youtube-scripts public/data/image-prompts public/data/video-prompts public/data/motion-prompts public/data/llm-health.json public/data/top.json; do
            if [ -e "$path" ]; then git add "$path"; fi
          done
          if git diff --cached --quiet; then
            echo "Sin cambios de guiones que commitear"
          else
            git commit -m "chore: update youtube scripts"
            pushed=false
            for i in 1 2 3; do
              git fetch origin
              if ! git rebase --autostash origin/main; then
                git rebase --abort || true
                echo "Conflicto con main: revisar a mano"
                exit 1
              fi
              if git push origin HEAD:main; then
                pushed=true
                break
              fi
              echo "Push rechazado, reintento $i/3"
              sleep 10
            done
            if [ "$pushed" != "true" ]; then exit 1; fi
          fi
      - name: Publicar selección e inputs para media
        uses: actions/upload-artifact@v4
        with:
          name: goatlab-content-selection
          include-hidden-files: true
          if-no-files-found: error
          path: |
            .cache/content-selection.json
            public/data/youtube-scripts/*.json
            public/data/image-prompts/*.json
            public/data/video-prompts/*.json
            public/data/motion-prompts/*.json
          retention-days: 7
      - name: Comprobar resultado de generación
        if: always() && steps.scripts.outcome == 'failure'
        run: exit 1
