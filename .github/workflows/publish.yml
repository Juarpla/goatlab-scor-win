name: Actualizar datos GoatLab
on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: '0 7 * * *'    # actualización completa: ventana de 7 días, forma, análisis (2 a.m. hora de Perú)
    - cron: '17 */6 * * *' # refresco de marcadores del día
# The bot commits refreshed data back to the repo; that push triggers the
# Cloudflare Workers deploy (GitHub Actions never deploys itself).
permissions:
  contents: write
concurrency:
  group: goatlab-publish
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      # Disponible en los `if` (el contexto `secrets` no está permitido ahí).
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # historial completo: el commit del bot hace rebase antes del push
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node --test tests/*.test.js
      - name: Actualización completa (diaria, 07:00 UTC)
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'schedule' && github.event.schedule == '0 7 * * *')
        run: node scripts/update-data.mjs
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          FOOTBALL_DATA_KEY: ${{ secrets.FOOTBALL_DATA_KEY }}
          BZZOIRO_API_TOKEN: ${{ secrets.BZZOIRO_API_TOKEN }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          WORKERS_AI_API_KEY: ${{ secrets.WORKERS_AI_API_KEY }}
          OPENCODE_GO_API_KEY: ${{ secrets.OPENCODE_GO_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          MISTRAL_MODEL: ${{ vars.MISTRAL_MODEL }}
          WORKERS_AI_MODEL: ${{ vars.WORKERS_AI_MODEL }}
          OPENCODE_GO_MODEL: ${{ vars.OPENCODE_GO_MODEL }}
      - name: Refresco de marcadores (cada 6 horas)
        if: github.event.schedule == '17 */6 * * *'
        run: node scripts/update-data.mjs --refresh
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          FOOTBALL_DATA_KEY: ${{ secrets.FOOTBALL_DATA_KEY }}
          BZZOIRO_API_TOKEN: ${{ secrets.BZZOIRO_API_TOKEN }}
      - name: Guiones de Shorts (ventana vigente + lint bloqueante)
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
        run: node scripts/generate-youtube-scripts.mjs && node scripts/check-compliance.mjs
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          WORKERS_AI_API_KEY: ${{ secrets.WORKERS_AI_API_KEY }}
          OPENCODE_GO_API_KEY: ${{ secrets.OPENCODE_GO_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          MISTRAL_MODEL: ${{ vars.MISTRAL_MODEL }}
          WORKERS_AI_MODEL: ${{ vars.WORKERS_AI_MODEL }}
          OPENCODE_GO_MODEL: ${{ vars.OPENCODE_GO_MODEL }}
      - name: Media-pack de Shorts (fotos con licencia)
        if: (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule') && env.PEXELS_API_KEY != ''
        run: node scripts/generate-media-pack.mjs
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
      - uses: actions/upload-artifact@v4
        with:
          name: goatlab-data
          path: public/data/
          retention-days: 30
      - run: pnpm run build
      - name: Commit de datos actualizados
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data public/match-probabilities public/ads.txt
          if git diff --cached --quiet; then
            echo "Sin cambios de datos que commitear"
          else
            git commit -m "chore: update data"
            # main pudo avanzar (push manual) mientras corría el workflow:
            # rebase + reintentos en vez de fallar con "fetch first".
            for i in 1 2 3; do
              git fetch origin
              if ! git rebase --autostash origin/main; then
                git rebase --abort || true
                echo "Conflicto con main: revisar a mano"
                exit 1
              fi
              if git push origin HEAD:main; then
                break
              fi
              echo "Push rechazado, reintento $i/3"
              sleep 10
            done
          fi
