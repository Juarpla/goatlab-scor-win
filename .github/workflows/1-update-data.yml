name: "1-update-data"
on:
  workflow_dispatch:
  schedule:
    - cron: '5 6 * * *'    # full update: 7-day window, form, analysis (01:05 Lima)
    - cron: '17 */6 * * *' # day scoreline refresh
# The bot commits refreshed data back to the repo; that push triggers the
# Cloudflare Workers deploy (GitHub Actions never deploys itself).
# build-top.mjs writes public/data/top.json (full ranking + extras):
# 2-scripting and 3-media-creation read the same top and never diverge.
permissions:
  contents: write
concurrency:
  group: goatlab-content-pipeline
  cancel-in-progress: false
  queue: max
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history: the bot commit rebases before push
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Full update (daily, 07:00 UTC)
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'schedule' && github.event.schedule == '5 6 * * *')
        run: node actions/1-update-data/update-data.mjs && node actions/1-update-data/build-top.mjs
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          FOOTBALL_DATA_KEY: ${{ secrets.FOOTBALL_DATA_KEY }}
          BZZOIRO_API_TOKEN: ${{ secrets.BZZOIRO_API_TOKEN }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          WORKERS_AI_API_KEY: ${{ secrets.WORKERS_AI_API_KEY }}
          OPENCODE_GO_API_KEY: ${{ secrets.OPENCODE_GO_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          MISTRAL_BASE_URL: ${{ vars.MISTRAL_BASE_URL }}
          MISTRAL_MODEL: ${{ vars.MISTRAL_MODEL }}
          WORKERS_AI_MODEL: ${{ vars.WORKERS_AI_MODEL }}
          OPENCODE_GO_MODEL: ${{ vars.OPENCODE_GO_MODEL }}
          OPENCODE_GO_FALLBACK_MODEL: ${{ vars.OPENCODE_GO_FALLBACK_MODEL }}
          LLM_PROVIDER_ORDER: ${{ vars.LLM_PROVIDER_ORDER }}
          ANALYSIS_PROVIDER_ORDER: ${{ vars.ANALYSIS_PROVIDER_ORDER }}
          ANALYSIS_BATCH_SIZE: ${{ vars.ANALYSIS_BATCH_SIZE }}
          ANALYSIS_MAX_TOKENS: ${{ vars.ANALYSIS_MAX_TOKENS }}
          ANALYSIS_RETRY_MAX_TOKENS: ${{ vars.ANALYSIS_RETRY_MAX_TOKENS }}
          ANALYSIS_BATCH_MAX_TOKENS: ${{ vars.ANALYSIS_BATCH_MAX_TOKENS }}
          ANALYSIS_BATCH_RETRY_MAX_TOKENS: ${{ vars.ANALYSIS_BATCH_RETRY_MAX_TOKENS }}
      - name: Scoreline refresh (every 6 hours)
        if: github.event.schedule == '17 */6 * * *'
        run: node actions/1-update-data/update-data.mjs --refresh && node actions/1-update-data/build-top.mjs
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          FOOTBALL_DATA_KEY: ${{ secrets.FOOTBALL_DATA_KEY }}
          BZZOIRO_API_TOKEN: ${{ secrets.BZZOIRO_API_TOKEN }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          WORKERS_AI_API_KEY: ${{ secrets.WORKERS_AI_API_KEY }}
          OPENCODE_GO_API_KEY: ${{ secrets.OPENCODE_GO_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          MISTRAL_BASE_URL: ${{ vars.MISTRAL_BASE_URL }}
          MISTRAL_MODEL: ${{ vars.MISTRAL_MODEL }}
          WORKERS_AI_MODEL: ${{ vars.WORKERS_AI_MODEL }}
          OPENCODE_GO_MODEL: ${{ vars.OPENCODE_GO_MODEL }}
          OPENCODE_GO_FALLBACK_MODEL: ${{ vars.OPENCODE_GO_FALLBACK_MODEL }}
          LLM_PROVIDER_ORDER: ${{ vars.LLM_PROVIDER_ORDER }}
          ANALYSIS_PROVIDER_ORDER: ${{ vars.ANALYSIS_PROVIDER_ORDER }}
          ANALYSIS_BATCH_SIZE: ${{ vars.ANALYSIS_BATCH_SIZE }}
          ANALYSIS_MAX_TOKENS: ${{ vars.ANALYSIS_MAX_TOKENS }}
          ANALYSIS_RETRY_MAX_TOKENS: ${{ vars.ANALYSIS_RETRY_MAX_TOKENS }}
          ANALYSIS_BATCH_MAX_TOKENS: ${{ vars.ANALYSIS_BATCH_MAX_TOKENS }}
          ANALYSIS_BATCH_RETRY_MAX_TOKENS: ${{ vars.ANALYSIS_BATCH_RETRY_MAX_TOKENS }}
      - name: Purge media after the data update
        continue-on-error: true # keep available data even if the remote store does not respond
        run: node actions/1-update-data/maintain-media.mjs
        env:
          MEDIA_ROLE: producer
          R2_STATE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_STATE_BUCKET: app-states
          R2_STATE_KEY: goatlab/agnes-state.json
          R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_BUCKET: goatlab
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      - uses: actions/upload-artifact@v4
        with:
          name: goatlab-data
          path: public/data/
          retention-days: 30
      - run: pnpm run build
      - name: Commit updated data
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data public/match-probabilities public/ads.txt
          if git diff --cached --quiet; then
            echo "No data changes to commit"
          else
            git commit -m "chore: update data"
            # main may have advanced (manual push) while the workflow ran:
            # rebase + retries instead of failing with "fetch first".
            pushed=false
            for i in 1 2 3; do
              git fetch origin
              if ! git rebase --autostash origin/main; then
                git rebase --abort || true
                echo "Conflict with main: review by hand"
                exit 1
              fi
              if git push origin HEAD:main; then
                pushed=true
                break
              fi
              echo "Push rejected, retry $i/3"
              sleep 10
            done
            if [ "$pushed" != "true" ]; then exit 1; fi
          fi
