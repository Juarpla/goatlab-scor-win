name: "5-editorial-research"
on:
  schedule:
    - cron: '37 13 * * 1,4'
  workflow_dispatch:
    inputs:
      operation:
        type: choice
        options: [preview, publish, refresh-preview, refresh]
        default: preview
permissions:
  contents: read
concurrency:
  group: goatlab-editorial
  cancel-in-progress: false
jobs:
  editorial:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: Generate or refresh an editorial
        run: |
          case "$OPERATION" in
            preview) node actions/5-editorial/publish.mjs --preview ;;
            refresh-preview) node actions/5-editorial/publish.mjs --refresh --preview ;;
            refresh) node actions/5-editorial/publish.mjs --refresh ;;
            *) node actions/5-editorial/publish.mjs ;;
          esac
        env:
          OPERATION: ${{ inputs.operation }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GOATLAB_D1_API_TOKEN: ${{ secrets.GOATLAB_D1_API_TOKEN }}
          AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          WORKERS_AI_API_KEY: ${{ secrets.WORKERS_AI_API_KEY }}
          EDITORIAL_PROVIDER_ORDER: ${{ vars.EDITORIAL_PROVIDER_ORDER || 'AGNES_MODEL,MISTRAL_MODEL,WORKERS_AI_MODEL' }}
          MISTRAL_BASE_URL: ${{ vars.MISTRAL_BASE_URL }}
          MISTRAL_MODEL: ${{ vars.EDITORIAL_MISTRAL_MODEL || 'ministral-8b-2512' }}
          WORKERS_AI_MODEL: ${{ vars.WORKERS_AI_MODEL }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: goatlab-editorial-brief
          path: editorial-brief/
          retention-days: 45
