name: "0-test-and-build"
on:
  push:
    branches: [main]
  pull_request:
# Tests y build fuera de 1-update-data.yml: un test roto no debe frenar la
# actualización de datos de la web.
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: ffmpeg (tests de mezcla de cama)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: dependencias de render (Remotion)
        run: npm ci --no-audit --no-fund
        working-directory: video-render/render/remotion
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python3 -m unittest discover -s tests/pipeline -v
      - run: pnpm test
      - run: pnpm run lint:shorts
      - run: pnpm run lint:prompts
      - run: pnpm run build
      - run: pnpm run check:publication
