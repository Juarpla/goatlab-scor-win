app = 'goatlab-render'
primary_region = 'iad'

[build]
  dockerfile = 'Dockerfile'

[http_service]
  internal_port = 3000
  force_https = true
  # El downscaler del proxy aborta el stop (cordon y uncordon cada ~6 min).
  # El proceso sale con código 0 al quedar idle; on-failure no lo reinicia.
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 0

[env]
  RENDER_LEDGER_URL = 'https://goatlab-gateway.fly.dev/render-ledger'
  OPENCODE_GO_MODEL = 'deepseek-v4.1-flash'
  OPENCODE_GO_FALLBACK_MODEL = 'mimo-v2.6-flash'
  EDIT_PLAN_TIMEOUT_SECONDS = '120'
  # Workers de captura de HyperFrames (un Chrome cada uno, ~256 MB).
  # Ajustar con `hyperframes benchmark` en esta VM.
  RENDER_WORKERS = '2'

[[vm]]
  cpu_kind = 'shared'
  cpus = 2
  # Chrome (HyperFrames) no cabe en 2 GB. La CPU sigue shared: el tiempo es la captura.
  memory_mb = 4096
