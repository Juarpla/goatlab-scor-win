name: "test-and-build"
on:
  push:
    branches: [main]
  pull_request:
# Tests y build fuera de publish.yml: un test roto no debe frenar la
# actualización de datos de la web.
permissions:
  contents: read
jobs:
  gateway:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: OpenClaw retention, startup and access
        # Retention inspects /proc before touching SQLite. Give the tests their
        # own PID namespace, like Fly, instead of inspecting protected runner
        # services. Keep the tests unprivileged and the ownership guard enabled.
        run: >-
          docker run --rm --init --network none
          --user "$(id -u):$(id -g)"
          --volume "$PWD:/workspace:ro" --workdir /workspace
          node:24-bookworm-slim
          node --test tests/conversation-retention.test.js tests/gateway-runtime.test.js tests/ui-access.test.js tests/idle-safety.test.js
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: ffmpeg (tests de mezcla de cama)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: dependencias de render (Remotion)
        run: npm ci --no-audit --no-fund
        working-directory: fly/render
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python3 -m unittest discover -s tests/pipeline -v
      - run: node scripts/sync-goatlab-skill.mjs --check
      - run: pnpm test
      - run: pnpm run lint:shorts
      - run: pnpm run lint:prompts
      - run: pnpm run build
      - run: pnpm run check:publication
