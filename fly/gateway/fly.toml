app = "goatlab-gateway"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  OPENCLAW_STATE_DIR = "/data"
  OPENCLAW_CONFIG_PATH = "/home/node/.openclaw/openclaw.json"

[mounts]
  source = "goatlab_state"
  destination = "/data"

[[vm]]
  size = "shared-cpu-2x"
  memory = "2gb"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "60s"
    interval = "30s"
    method = "GET"
    path = "/startupz"
    protocol = "http"
    timeout = "5s"
