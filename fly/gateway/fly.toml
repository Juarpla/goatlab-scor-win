app = "goatlab-gateway"
primary_region = "iad"
kill_signal = "SIGTERM"
kill_timeout = "30s"

[build]
  # Fly resolves this relative to fly.toml; the deploy context is the repo root.
  dockerfile = "Dockerfile"

[env]
  OPENCLAW_STATE_DIR = "/data"
  OPENCLAW_CONFIG_PATH = "/home/node/.openclaw/openclaw.json"
  # Trace the actual pending bootstrap/SQLite phase on cold starts.
  OPENCLAW_GATEWAY_STARTUP_TRACE = "1"
  # Observe slow cold starts without interrupting SQLite admission.
  GOATLAB_GATEWAY_STARTUP_TIMEOUT_MS = "0"
  # Physical expiry needs the local retention supervisor to keep running.
  GOATLAB_IDLE_STOP_ENABLED = "0"
  OPENCODE_GO_MODEL = "deepseek-v4.1-flash"
  OPENCODE_GO_FALLBACK_MODEL = "glm-5.3-flash"
  # Both models verified with image attachments through the native OpenClaw Gateway.
  CREATIVE_DIRECTOR_ENABLED = "1"
  GOATLAB_MAX_DIRECTORS = "1"
  MEDIA_ROLE = "consumer"
  GOATLAB_CONTENT_BASE_URL = "https://goatlab.win"
  # Gateway consulta R2; Actions produce y mantiene el banco.
  MEDIA_GEN_BASE = "https://pub-7a18e0f62bb14c3a987f20633a81b283.r2.dev"
  R2_PUBLIC_BASE = "https://pub-7a18e0f62bb14c3a987f20633a81b283.r2.dev"
  R2_BUCKET = "goatlab"
  WORKER_URL = "https://goatlab-render.fly.dev"
  TELEGRAM_ALLOWED_USERS = "1295170307"
  TELEGRAM_PUBLIC_WEBHOOK_URL = "https://goatlab-gateway.fly.dev/telegram-webhook"
  OPENCLAW_UI_ORIGIN = "https://goatlab-gateway.fly.dev"
  # Modo cinemático desactivado: main volvió al motion anterior a v4.1/v5.
  GOATLAB_CINEMA_V5 = "0"

[mounts]
  source = "goatlab_state"
  destination = "/data"
  scheduled_snapshots = false
  snapshot_retention = 1

[[vm]]
  size = "shared-cpu-2x"
  memory = "2gb"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    # Fly caps service-check grace at one minute; startup itself has no watchdog.
    grace_period = "1m"
    interval = "30s"
    method = "GET"
    path = "/startupz"
    protocol = "http"
    timeout = "5s"
